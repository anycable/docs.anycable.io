# No base directory: with base=docs the CLI bundled edge functions relative to
# the base but assembled the deploy from the repo root, shipping 0 of them.
# Root-relative paths keep build, bundling, and deploy consistent.
[build]
  publish = "docs/.vitepress/dist"
  command = "npm --prefix docs run build"
  edge_functions = "docs/netlify/edge-functions"

# The /index.md rewrite serves llms.txt, which would otherwise arrive as text/plain.
[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=UTF-8"
