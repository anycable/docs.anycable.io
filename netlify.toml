[build]
  base="docs"
  publish = "docs/.vitepress/dist"
  command="npm run build"
  # Relative to the repo root (like publish), not to base.
  edge_functions = "docs/netlify/edge-functions"

# The /index.md rewrite serves llms.txt, which would otherwise arrive as text/plain.
[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=UTF-8"
